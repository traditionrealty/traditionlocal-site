name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every morning so the weekly picks and event lists on pages built at deploy time
  # (area pages, newsletters) stay current. 11:00 UTC is 6 AM in Houston during daylight time.
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rebuild data from the spreadsheets and export
        run: |
          pip install pandas openpyxl pyyaml markdown
          python scripts/prepare_data.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Report leftovers in the built site (never blocks the deploy)
        run: node scripts/check-output.mjs || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
