# Pages CMS configuration (https://app.pagescms.org)
# Saving in the editor commits to main, which runs the "Deploy to GitHub Pages" action.

media:
  input: public/media
  output: /media
  rename: safe
  categories: [image]

content:
  - name: posts
    label: Posts and reviews
    type: collection
    path: content/posts
    format: yaml-frontmatter
    exclude: [README.md]
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, author, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
        description: "Business name, then what it is and where, e.g. Tree House, Frozen Yogurt and Coffee in the Energy Corridor"
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: true
        description: Turn this off when the post is ready to go live.
      - name: date
        label: Publish date
        type: date
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Last updated (optional)
        type: date
        default: ""
        description: Set this when you make a real update to an older post.
        options:
          format: yyyy-MM-dd
      - name: author
        label: Author
        type: select
        default: Sara Loren
        options:
          values: [Sara Loren, Dillon Loren, Mark Wang, Tradition Realty Group]
      - name: categories
        label: Categories
        type: select
        options:
          multiple: true
          values:
            - { name: food, label: Food }
            - { name: neighborhoods, label: Neighborhoods }
            - { name: travel, label: Travel }
            - { name: spotlight, label: Spotlight }
            - { name: announcement, label: Announcement }
            - { name: newsletter, label: Newsletter }
            - { name: worth-the-drive, label: "Worth the Drive (weekly Food Feature pick)" }
      - name: description
        label: Summary (search results and previews)
        type: text
        description: One or two sentences, about 150 characters. Lead with the direct answer.
      - name: image
        label: Main photo
        type: image
      - name: imageAlt
        label: Photo description
        type: string
        description: "e.g. Iced latte at Tree House in the Energy Corridor, Houston"
      - name: slug
        label: URL (optional)
        type: string
        description: Leave blank to build it from the title. Don't change it after the post is live.
      - name: body
        label: Post
        type: rich-text

  - name: newsletters
    label: Newsletter editions
    type: collection
    path: content/newsletters
    format: yaml-frontmatter
    exclude: [README.md]
    filename: "{weekStart}.md"
    view:
      fields: [title, weekStart, draft]
      primary: title
      sort: [weekStart]
      default:
        sort: weekStart
        order: desc
    fields:
      - name: title
        label: Headline
        type: string
        required: true
        description: The lead story headline for the week.
      - name: draft
        label: Draft (hidden from the site)
        type: boolean
        default: true
        description: Turn this off to publish. The newest edition that is not a draft shows on the Newsletters page.
      - name: weekStart
        label: Week starts (Monday)
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: weekEnd
        label: Week ends (Sunday)
        type: date
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Intro line under the headline
        type: text
      - name: leadLabel
        label: Lead story label
        type: string
        default: Food & Drink
      - name: image
        label: Main photo
        type: image
      - name: imageAlt
        label: Photo description
        type: string
      - name: event
        label: Next community event card
        type: object
        fields:
          - { name: label, label: Small label, type: string, default: "Coffee & Conversations" }
          - { name: title, label: Title, type: string }
          - { name: when, label: Day and time, type: string }
          - { name: body, label: Description, type: text }
          - { name: buttonLabel, label: Button text, type: string, default: "View event details" }
          - { name: url, label: Button link, type: string, description: "Site path such as /event-details/the-event-name" }
      - name: body
        label: Newsletter
        type: rich-text
        description: "Write the lead story first. Then start each new section with a Heading 2 (for example Restaurant of the Week: Long Weekend, Market Pulse: Real Estate Update, Things to Do, Sports, Openings & Closings). A colon in a heading puts the part before it in small type above the title."
